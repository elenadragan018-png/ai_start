<section id="lectia1" class="lesson-section">
<div class="lesson-container">

  <div class="quiz-block">
    <div class="quiz-q" data-q="L1Q1">
      <div class="q-text">1) Care este relația corectă dintre Inteligența Artificială (IA) și Large Language Models (LLM)?</div>
      <div class="choices">
        <label class="choice"><input type="radio" name="L1Q1" value="0"> IA și LLM sunt două concepte complet separate fără legătură</label>
        <label class="choice"><input type="radio" name="L1Q1" value="1"> LLM este domeniul cel mai larg, iar IA este o sub-ramură a sa</label>
        <label class="choice"><input type="radio" name="L1Q1" value="2"> LLM este un tip specializat de Deep Learning, care face parte din Machine Learning, o ramură a IA</label>
        <label class="choice"><input type="radio" name="L1Q1" value="3"> Machine Learning și LLM sunt același lucru, doar că folosesc denumiri diferite</label>
      </div>
      <div class="ok-msg" data-msg="Exact! LLM-urile sunt modele de Deep Learning ce aparțin domeniului mai larg al machine learning-ului, care e parte din domeniul IA[cite: 1]."></div>
      <div class="bad-msg" data-msg="Nu chiar. Amintește-ți modelul cu cercuri concentrice: IA este cel mai larg domeniu, urmat de ML, Deep Learning și LLM[cite: 1]."></div>
      <div class="feedback"></div>
    </div>

    <div class="quiz-q" data-q="L1Q2">
      <div class="q-text">2) Care dintre următoarele este un exemplu de IA generativă?</div>
      <div class="choices">
        <label class="choice"><input type="radio" name="L1Q2" value="0"> Un filtru anti-spam care marchează un e-mail ca dubios</label>
        <label class="choice"><input type="radio" name="L1Q2" value="1"> Un filtru pe bază de amprentă care îți deblochează telefonul</label>
        <label class="choice"><input type="radio" name="L1Q2" value="2"> Un algoritm care scrie un eseu nou pe baza unei cereri</label>
        <label class="choice"><input type="radio" name="L1Q2" value="3"> Un senzor de lumină care aprinde becul când se întunecă</label>
      </div>
      <div class="ok-msg" data-msg="Corect! IA generativă creează conținut nou (text, imagini, cod)[cite: 1], în timp ce un filtru anti-spam doar clasifică[cite: 1]."></div>
      <div class="bad-msg" data-msg="Gândește-te la termenul „generativ: înseamnă a crea ceva nou[cite: 1] (text, imagine, sunet), nu doar a clasifica sau a măsura[cite: 1]."></div>
      <div class="feedback"></div>
    </div>

    <div class="quiz-q" data-q="L1Q3">
      <div class="q-text">3) Ce înseamnă că o IA este „narrow" (specializată)?</div>
      <div class="choices">
        <label class="choice"><input type="radio" name="L1Q3" value="0"> Că este creată doar pentru telefoane mici</label>
        <label class="choice"><input type="radio" name="L1Q3" value="1"> Că este conștientă și poate rezolva orice problemă umană</label>
        <label class="choice"><input type="radio" name="L1Q3" value="2"> Că poate fi folosită doar de specialiști în informatică</label>
        <label class="choice"><input type="radio" name="L1Q3" value="3"> Că este proiectată pentru o sarcină specifică și nu are conștiință sau înțelegere generală</label>
      </div>
      <div class="ok-msg" data-msg="Foarte bine! Toată IA actuală este de tip narrow[cite: 1] — face excelent o anumită sarcină[cite: 1], dar nu are conștiință sau adaptabilitate generală[cite: 1]."></div>
      <div class="bad-msg" data-msg="Incorrect. IA narrow este proiectată pentru o sarcină bine definită[cite: 1] (ex. recomandare de clipuri, traducere text)[cite: 1]. AGI este conceptul de inteligență generală[cite: 1]."></div>
      <div class="feedback"></div>
    </div>
  </div>
